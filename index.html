<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
        <h1>Version DEV</h1>
    </head>
    <body>
        <div class="carte" id="Feu">
            <h1>Dracaufeu</h1>
            <img id="Dragon" src="dracaufeu.jpg" alt="Dragon de feu"/>
            <p>Type - Feu</p>
            <ul>
                <li>Attaque <span>90</span></li>
                <li>Defense <span>90</span></li>
            </ul>
        </div>

        <div class="carte" id="Eau">
            <h1>Lokhlass</h1>
            <img id="Créature" src="lokhlass.png" alt="Créature aquatique"/>
            <p>Type - Eau</p>
            <ul>
                <li>Attaque <span>50</span></li>
                <li>Defense <span>80</span></li>
            </ul>
        </div>

        <div class="carte" id="Plante">
            <h1>Florizarre</h1>
            <img id="Fleur" src="florizarre.jpg" alt="Géant de mousse"/>
            <p>Type - Plante</p>
            <ul>
                <li>Attaque <span>90</span></li>
                <li>Defense <span>90</span></li>
            </ul>
        </div>

        <div class="carte" id="Légendaire">
            <h1>Giratina</h1>
            <img id="Ombre" src="giratina.jpg" alt="Oiseau légendaire"/>
            <p>Type - Spectre et Dragon</p>
            <ul>
                <li>Attaque <span>90</span></li>
                <li>Defense <span>90</span></li>
            </ul>
        </div>
    </body>
</html>
